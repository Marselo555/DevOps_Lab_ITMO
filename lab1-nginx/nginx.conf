events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    upstream notebook_backends {
        server host.docker.internal:8001 max_fails=1 fail_timeout=5s;
        server host.docker.internal:8002 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate /etc/nginx/certs/local.crt;
        ssl_certificate_key /etc/nginx/certs/local.key;
        return 404;
    }

    server {
        listen 443 ssl;
        server_name notes.test;
        ssl_certificate /etc/nginx/certs/local.crt;
        ssl_certificate_key /etc/nginx/certs/local.key;
        root /srv/frontend;
        index index.html;

        error_page 404 /404.html;
        location = /404.html {
            internal;
            alias /srv/pages/404.html;
        }

        location /static/ {
            alias /srv/frontend/;
        }

        location = /docs {
            return 301 /docs/;
        }
        location /docs/ {
            alias /srv/docs/;
            index index.html;
        }

        location = /admin {
            auth_basic "Admin area";
            auth_basic_user_file /etc/nginx/.htpasswd;
            alias /srv/pages/admin.html;
        }

        location /api {
            limit_req zone=api burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://notebook_backends;
            proxy_set_header Host $host;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 443 ssl;
        server_name other.test;
        ssl_certificate /etc/nginx/certs/local.crt;
        ssl_certificate_key /etc/nginx/certs/local.key;
        root /srv/other;
        index index.html;

        error_page 404 /404.html;
        location = /404.html {
            internal;
            alias /srv/pages/404.html;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
