name: devops-lab2

services:
  frontend:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8082}:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - web

  backend:
    build:
      context: ..
      dockerfile: lab2-docker/Dockerfile.good
    image: ${BACKEND_IMAGE:-devops-lab2-good:local}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      DB_STARTUP_RETRIES: "30"
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    depends_on:
      - db
    networks:
      - web
      - data

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - notes_data:/var/lib/postgresql/data
    networks:
      - data

networks:
  web:
  data:

volumes:
  notes_data:
